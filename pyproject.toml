[project]
name = "oncall-graph"
version = "0.1.0"
description = "Graph-powered on-call agent: an MCP server + Claude Code plugin that diagnoses, fixes and remembers incidents using FalkorDB."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "falkordb>=1.0.10",
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
oncall-graph = "oncall_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oncall_graph"]
