[project]
name = "rootpath"
version = "0.1.0"
description = "Graph-powered on-call agent: an MCP server + Claude Code plugin that diagnoses, fixes and remembers incidents using FalkorDB."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "falkordb>=1.0.10",
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/IWhitebird/rootpath"
Repository = "https://github.com/IWhitebird/rootpath"

[project.scripts]
rootpath = "rootpath.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rootpath"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
markers = ["integration: needs the live demo stack (rootpath demo up)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["bench/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
