<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootpath · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.47.4/dist/force-graph.min.js"></script>
<link rel="stylesheet" href="/console.css">
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><circle cx="5" cy="6" r="3.2" fill="currentColor"/><circle cx="20" cy="6" r="3.2" fill="currentColor" opacity=".45"/><circle cx="13" cy="13" r="3.2" fill="currentColor"/><circle cx="20" cy="20" r="3.6" fill="var(--bad)"/><path d="M5 6 13 13 20 20M20 6 13 13" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".55"/><circle cx="20" cy="20" r="6.2" fill="none" stroke="var(--path)" stroke-width="1.6"/></svg>
      Rootpath
    </div>
    <span class="env" id="env">demo · FalkorDB</span>
    <div class="spacer"></div>
    <div class="menu-wrap">
      <button class="btn danger" id="break-btn" aria-haspopup="true" aria-expanded="false">Break something ▾</button>
      <div class="menu" id="break-menu" hidden></div>
    </div>
    <div class="seg" role="group" aria-label="Agent tools">
      <button id="mode-graph" aria-pressed="true" title="Agent gets the FalkorDB graph tools">graph</button>
      <button id="mode-baseline" aria-pressed="false" title="Agent gets only health, logs and a flat change list">baseline</button>
    </div>
    <button class="btn primary" id="run">Run agent</button>
    <button class="btn" id="reset" title="Restore healthy state and keep incident memory. Shift-click for a fresh graph.">Reset</button>
  </header>
  <div class="strip">
    <span class="status" id="status"><span class="dot"></span><span id="status-text">All services healthy</span></span>
    <span class="kv" id="kv-inc"></span>
    <span class="kv" id="kv-agent"></span>
    <span class="kv" id="kv-mem"></span>
    <span class="spacer"></span>
    <span class="busy" id="busy"></span>
  </div>
  <main>
    <div class="stage">
      <div class="graph-area">
        <div id="graph"></div>
        <div class="caption" id="caption"><span class="chip">idle</span><span class="text">Break something, then run the agent.</span></div>
        <div class="detail" id="detail" hidden></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <aside>
      <div class="health"><h4>Live health · last 10s</h4><div id="health"></div></div>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="inv">Investigation</button>
        <button role="tab" aria-selected="false" data-tab="inc">Incident memory <span class="count" id="inc-count">0</span></button>
        <button role="tab" aria-selected="false" data-tab="chg">Changes <span class="count" id="chg-count">0</span></button>
      </div>
      <div class="panel" id="panel-inv"><div class="meta" id="inv-meta"></div><div id="steps"><p class="empty">No investigation yet.</p></div><div class="report" id="report" hidden></div></div>
      <div class="panel" id="panel-inc" hidden></div>
      <div class="panel" id="panel-chg" hidden></div>
    </aside>
  </main>
</div>
<script src="/console.js"></script>
</body>
</html>
