# Publishes the project website (site/index.html, with the recorded incident replays and the
# benchmark results inlined) to GitHub Pages on every push.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: website
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py --repo "https://github.com/${{ github.repository }}"
      - run: mkdir -p _site && cp site/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
